framework:
    messenger:
        failure_transport: failed

        transports:
            import:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 5
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000

            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: failed
                    queues:
                        failed: ~

when@test:
    framework:
        messenger:
            transports:
                import: 'in-memory://'
                failed: 'in-memory://'
